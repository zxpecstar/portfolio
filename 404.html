<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317181B'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232451B5'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="page-404">

  <div class="wrap"></div>

  <!-- A 404 page can be served from any URL depth (e.g. /repo-name/missing/page), so relative
       paths don't work here. This finds the folder your site lives in by trying each parent
       path until config.js loads, then loads the stylesheet and scripts from there.
       Works on user sites, project sites (username.github.io/repo/) and custom domains. -->
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var bases = ["/"];
      parts.forEach(function (p, i) { bases.push("/" + parts.slice(0, i + 1).join("/") + "/"); });

      function load(tag, attrs, ok, fail) {
        var n = document.createElement(tag);
        for (var k in attrs) n[k] = attrs[k];
        n.onload = ok; n.onerror = fail;
        document.head.appendChild(n);
      }

      function tryBase(i) {
        if (i >= bases.length) { document.body.textContent = "404 — Page not found"; return; }
        var b = bases[i];
        load("script", { src: b + "config.js" }, function () {
          window.__BASE__ = b;
          load("link", { rel: "stylesheet", href: b + "style.css" });
          load("script", { src: b + "script.js" });
        }, function () { tryBase(i + 1); });
      }
      tryBase(0);
    })();
  </script>
</body>
</html>
