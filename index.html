<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- LINK PREVIEWS: X, Slack, Discord and search engines read these tags without running JavaScript,
       so edit them to match config.js (name, description). For a preview image, uncomment og:image
       and use a full https:// URL (1200x630 px works well), then change twitter:card to
       "summary_large_image". Also uncomment og:url and add your site address. -->
  <title>Your Name</title>
  <meta name="description" content="Portfolio of Your Name — web developer and designer.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Your Name">
  <meta property="og:description" content="Portfolio of Your Name — web developer and designer.">
  <!-- <meta property="og:url" content="https://your-username.github.io/"> -->
  <!-- <meta property="og:image" content="https://your-username.github.io/preview.png"> -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Your Name">
  <meta name="twitter:description" content="Portfolio of Your Name — web developer and designer.">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2317181B'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%232451B5'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">

  <noscript><style>.reveal{opacity:1;transform:none}</style></noscript>
</head>
<body>

  <!-- Everything inside .wrap is generated from config.js by script.js.
       To change your content, edit config.js, not this file. -->
  <div class="wrap"></div>

  <noscript>
    <p style="padding:48px 24px;text-align:center">This portfolio needs JavaScript enabled to display.</p>
  </noscript>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
